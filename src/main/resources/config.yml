# ==================================================================================
# VCTimeRewards Configuration - Professional Edition
# ==================================================================================
# 
# Available PlaceholderAPI Placeholders (use in scoreboards, holograms, etc.):
# 
# 🎤 VOICE TIME PLACEHOLDERS:
#   %vctime_total%                    - Total voice time (e.g., "5h 30m")
#   %vctime_total_formatted%          - Formatted total time (e.g., "5 hours, 30 minutes")
#   %vctime_total_seconds%            - Total seconds (raw number)
#   %vctime_total_minutes%            - Total minutes (raw number)
#   %vctime_total_hours%              - Total hours (raw number)
#   %vctime_session%                  - Current session time
#   %vctime_session_formatted%        - Current session formatted
#   %vctime_today%                    - Time spent today
#   %vctime_today_formatted%          - Today's time formatted
#   %vctime_yesterday%                - Time spent yesterday
#   %vctime_this_week%               - Time spent this week
#   %vctime_this_month%              - Time spent this month
#   
# 📊 STATUS & ACTIVITY PLACEHOLDERS:
#   %vctime_status%                   - Current status (In Voice, Offline, etc.)
#   %vctime_channel%                  - Current voice channel name
#   %vctime_channel_members%          - Current channel member count
#   %vctime_last_seen%               - Last seen timestamp
#   %vctime_is_online%               - true/false if player is in voice
#   %vctime_is_tracking%             - true/false if currently being tracked
#   
# 🏆 RANKING PLACEHOLDERS:
#   %vctime_rank%                     - Player's voice time rank (e.g., "#3")
#   %vctime_rank_suffix%              - Rank with suffix (e.g., "3rd")
#   %vctime_top_1_name%              - Name of #1 ranked player
#   %vctime_top_1_time%              - Time of #1 ranked player
#   %vctime_top_2_name%              - Name of #2 ranked player
#   %vctime_top_2_time%              - Time of #2 ranked player
#   %vctime_top_3_name%              - Name of #3 ranked player
#   %vctime_top_3_time%              - Time of #3 ranked player
#   %vctime_top_10_list%             - Formatted top 10 list
#   
# 📈 PROGRESS & GOALS PLACEHOLDERS:
#   %vctime_progress_1h%             - Progress to next hour (e.g., "45%")
#   %vctime_progress_10h%            - Progress to 10 hours
#   %vctime_progress_100h%           - Progress to 100 hours
#   %vctime_progress_bar_1h%         - Progress bar to next hour ████▓▓▓▓▓▓
#   %vctime_progress_bar_10h%        - Progress bar to 10 hours
#   %vctime_until_next_hour%         - Time until next hour milestone
#   %vctime_until_next_reward%       - Time until next reward
#   %vctime_next_reward_time%        - Next reward milestone time
#   %vctime_next_reward_desc%        - Next reward description
#   
# 💬 CHAT & ACTIVITY PLACEHOLDERS:
#   %vctime_messages%                - Total Discord messages sent
#   %vctime_messages_today%          - Messages sent today
#   %vctime_messages_rank%           - Chat ranking position
#   %vctime_combined_score%          - Combined voice + chat score
#   %vctime_combined_rank%           - Combined ranking position
#   
# 📊 STATISTICS PLACEHOLDERS:
#   %vctime_sessions_today%          - Number of voice sessions today
#   %vctime_sessions_total%          - Total voice sessions
#   %vctime_average_session%         - Average session length
#   %vctime_longest_session%         - Longest single session
#   %vctime_shortest_session%        - Shortest session
#   %vctime_best_day%               - Best day (most time)
#   %vctime_streak_days%            - Current daily streak
#   %vctime_first_join%             - First time joining voice
#   
# 🎯 MILESTONE PLACEHOLDERS:
#   %vctime_milestones_reached%      - Number of milestones reached
#   %vctime_rewards_claimed%         - Number of rewards claimed
#   %vctime_last_reward%            - Last reward received
#   %vctime_last_reward_time%       - When last reward was received
#   
# ==================================================================================
# DISCORD VOICE CHANNEL TRACKING SETTINGS
# ==================================================================================

# Minimum number of LINKED players required in a voice channel for time tracking
# This prevents tracking in empty or mostly empty channels
minimum-members: 2

# Whether both Discord and Minecraft user must be online for tracking
# false = Track time even when player is offline in Minecraft (recommended)
# true = Only track when player is online in both Discord and Minecraft
require-both-online: false

# =================================================================
# CHANNEL CONFIGURATION
# =================================================================

# Channel tracking mode: "whitelist" or "blacklist"
# - whitelist: Only track channels listed in "tracked-channels"
# - blacklist: Track all channels except those in "blacklisted-channels"
tracking-mode: "blacklist"

# Channels to track (only used when tracking-mode is "whitelist")
# To find channel IDs: Right-click channel in Discord → Copy ID (Developer Mode must be enabled)
tracked-channels:
  - "123456789012345678"  # Replace with your voice channel ID
  - "987654321098765432"  # Add more channel IDs as needed

# Channels to exclude from tracking (only used when tracking-mode is "blacklist")
blacklisted-channels:
  - "111111111111111111"  # Example: AFK channel
  - "222222222222222222"  # Example: Music bot channel

# =================================================================
# REWARD SYSTEM
# =================================================================

# Reward commands executed when players reach time thresholds
# Time can be specified in minutes (m), hours (h), or just numbers (treated as hours for compatibility)
# Commands are executed from console - use proper permissions
# Available placeholders: {player} = player name, {threshold} = time reached
# Voice channel time rewards
voice_rewards:
  "1m": "minecraft:give {player} minecraft:coal 5"                       # 1 minute: 5 coal (for testing)
  "5m": "minecraft:give {player} minecraft:iron_ingot 3"                 # 5 minutes: 3 iron ingots
  "30m": "minecraft:give {player} minecraft:iron_ingot 10"               # 30 minutes: 10 iron ingots
  "1h": "minecraft:give {player} minecraft:diamond 5"                    # 1 hour: 5 diamonds
  "90m": "minecraft:give {player} minecraft:emerald 3"                   # 1.5 hours: 3 emeralds
  "3h": "minecraft:give {player} minecraft:diamond_block 2"              # 3 hours: 2 diamond blocks  
  "5h": "minecraft:give {player} minecraft:netherite_ingot 1"            # 5 hours: 1 netherite ingot
  "10h": "minecraft:give {player} minecraft:enchanted_golden_apple 3"    # 10 hours: 3 golden apples
  "25h": "minecraft:give {player} minecraft:elytra 1"                    # 25 hours: elytra
  "50h": "minecraft:give {player} minecraft:beacon 1"                    # 50 hours: beacon
  "100h": "minecraft:give {player} minecraft:dragon_egg 1"               # 100 hours: dragon egg

# Chat message rewards - given for every X messages sent in Discord
# Available placeholders: {player} = player name, {messages} = total messages sent
chat_rewards:
  enabled: true
  rewards:
    10: "minecraft:give {player} minecraft:bread 3"                      # 10 messages: 3 bread
    50: "minecraft:give {player} minecraft:apple 5"                      # 50 messages: 5 apples
    100: "minecraft:give {player} minecraft:golden_apple 1"              # 100 messages: 1 golden apple
    500: "minecraft:give {player} minecraft:diamond 2"                   # 500 messages: 2 diamonds
    1000: "minecraft:give {player} minecraft:emerald_block 1"            # 1000 messages: 1 emerald block

# Server boost rewards - given when someone boosts the Discord server
# Available placeholders: {player} = player name
boost_rewards:
  enabled: true
  reward: "minecraft:give {player} minecraft:netherite_ingot 3"          # Server boost: 3 netherite ingots
  announcement: true                                                      # Announce boost rewards in chat

# =================================================================
# NOTIFICATIONS
# =================================================================

# Send notifications to players when they reach milestones
send-notifications: true

# Message sent to players when they reach a milestone
# Available placeholders: {time} = time reached (e.g., "1h", "30m")
notification-message: "&6🎉 &aCongratulations! You've spent &e{time} &ain Discord voice channels!"

# =================================================================
# ADVANCED SETTINGS
# =================================================================

# How often to check Discord voice channels (in seconds)
# Lower values = more responsive but higher CPU usage
# Default: 10 seconds (recommended: 5-15 seconds)
check-interval: 10

# How often to save player data (in minutes)
# Lower values = less data loss on crashes but more disk I/O
# Default: 5 minutes (recommended: 2-10 minutes)  
save-interval: 5

# Enable debug logging for troubleshooting
debug-mode: false

# =================================================================
# DATABASE SETTINGS (Optional - uses file storage by default)
# =================================================================

database:
  enabled: false
  host: "localhost"
  port: 3306
  database: "vctime"
  username: "root"
  password: "password"
