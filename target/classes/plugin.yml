name: VCTimeRewards
version: '1.0.0'
description: A Minecraft plugin that rewards players for time spent in Discord voice channels
author: Kiro
main: me.kiro.vctime.VCTimeRewards
api-version: 1.19
depend: [DiscordSRV]
softdepend: [PlaceholderAPI]

commands:
  vctime:
    description: Check your voice channel time
    usage: /vctime [player]
    permission: vctime.check
  vctimeadmin:
    description: Admin commands for VCTimeRewards
    usage: /vctimeadmin <status|reload|save|check|reset|list> [args]
    permission: vctime.admin
  leaderboard:
    description: View leaderboards for voice time and chat activity
    usage: /leaderboard <voice|chat|combined|top> [gui]
    permission: vctime.leaderboard
    aliases: [lb, top, rankings]
    
permissions:
  vctime.check:
    description: Allows checking voice channel time
    default: true
  vctime.admin:
    description: Allows administrative commands
    default: op
  vctime.leaderboard:
    description: Allows viewing leaderboards
    default: true
  vctime.notifications:
    description: Allows receiving plugin notifications
    default: true
